tp:{t:'Topic',e:'',f:[['ch','Chapter','chap',1],['name','Topic','text',1],['status','Status','sel:'+ST.join('|'),1],['par','Parent topic (leave blank for a normal topic, set for a subtopic)','par'],['due','Target date','date'],['notes','Notes','area']],dk:r=>[r.ch,r.name].join(),l:r=>h(r.name)},
as:{t:'Test / Examination',e:'No tests or examinations yet. Add one to start tracking results and countdowns.',o:(a,b)=>a.date>b.date?1:-1,f:[['name','Name','text',1],['subject','Subject','subj',1],['type','Type','sel:'+T.join('|'),1],['source','Source','sel:School|Academy|Self-study',1],['date','Date','date',1],['time','Start time','time'],['dur','Duration (min)','num'],['total','Total marks','num',1],['got','Marks obtained (blank until result)','num'],['topic','Topic tested','top'],['prep','Preparation','sel:Not started|In progress|Ready'],['mist','Mistakes made','area'],['plan','Improvement plan','area'],['notes','Notes','area']],dk:r=>[r.name,r.subject,r.date].join(),v:r=>r.total<=0?'Total marks must be above 0.':noNum(r,'got','total'),

er:{t:'Error',e:'No mistakes recorded yet. Log one to build your revision queue.',f:[['date','Date','date',1],['subject','Subject','subj',1],['topic','Chapter / topic','top'],['q','Question or reference','area',1],['wrong','Your incorrect answer','area'],['right','Correct answer','area'],['expl','Explanation','area'],['cat','Mistake category','sel:Conceptual misunderstanding|Forgotten information|Calculation error|Misreading the question|Incorrect application of a formula|Weak memorisation|Careless mistake|Time-management problem|Incomplete answer|Other',1],['src','Source','sel:School test|KIPS test|Independent assessment|Homework|Practice questions|Full-length paper'],['conf','Confidence','sel:Low|Medium|High'],['status','Revision status','sel:'+ES.join('|'),1]],dk:r=>[r.date,r.subject,r.q].join(),

function list(k,fl,pre,t){const c=C[k];const a=D[k].filter(fl||(()=>1)).sort(c.o||((x,y)=>(y.date||'')>(x.date||'')?1:-1));return`<div class="hd"><h2>${t||c.t+'s'}</h2><button class="pb" onclick="openForm('${k}','',${pre?JSON.stringify(pre).replace(/"/g,"'"):'null'})">+ Add</button></div>`+(a.length?a.map(r=>`<div class="rw"><div>${c.l(r)}</div><div class="ac">${c.x?c.x(r):''}<button onclick="openForm('${k}','${r.id}')">Edit</button><button onclick="del('${k}','${r.id}')">Delete</button></div></div>`).join(''):emp(c.e))}

subj:['subject-analytics','Subject Analytics',()=>D.s.flatMap(s=>{const r=res().filter(x=>x.s==s.id),p=r.map(x=>x.p);return[s.name+': avg '+f1(mean(p))+', tests '+r.length+(p.length?', high '+f1(Math.max(...p))+', low '+f1(Math.min(...p)):'')+', syllabus '+f1(sP(s.id)),...Object.entries(grp(r,x=>x.t)).map(([k,v])=>'    '+k+': '+f1(avg(v))+' ('+v.length+')'),'']})],
exam:['examination-results','Examination Results',()=>D.as.slice().sort((a,b)=>a.date>b.date?1:-1).map(x=>x.date+' | '+x.name+' | '+sn(x.subject)+' | '+x.type+' | '+x.source+' | '+(hasM(x)?x.got+'/'+x.total+' ('+f1(x.got/x.total*100)+')':'no result'))],

let DB,UID,pend,tm;
async function cloud(){try{const c=window.claude;if(!c)return;DB=await c.use('db');const u=await c.use('user');UID=u&&await u.id();if(!DB||!UID){DB=null;return}const s=await DB.doc('data/users/'+UID+'/state').get();if(s.exists&&s.data().ts>(D.ts||0))pend=s.data();else sync();render()}catch(e){}}
function sync(){if(!DB||!UID||pend)return;clearTimeout(tm);tm=setTimeout(()=>DB.doc('data/users/'+UID+'/state').set({ts:D.ts||Date.now(),json:JSON.stringify(D)}).catch(e=>alert('Cloud sync failed: '+(e.message||e.code))),1500)}
function useCloud(){localStorage.setItem(KEY,pend.json);pend=null;load();render()}
function pwa(){if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('StudyTrack offline setup:',e));}
const V={ta:()=>tests('Academy','Academy Tests'),ts:()=>tests('School','School Examinations'),tf:()=>tests('Self-study','Self-Study Tests'),cal:vCal,dash:vDash,subj:vSubj,syl:vSyl,as:vAs,tk:vTk,ac:vAc,st:vSt,er:vEr,cmp:vCmp,rev:vRev,rep:vRep,set:vSet};
function render(){const v=V[location.hash.slice(1)]?location.hash.slice(1):'dash';document.documentElement.dataset.theme=D.p.theme||'dark';$('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" class="${k==v?'on':''}" onclick="sel=null">${l}</a>`).join('');$('#app').innerHTML=(pend?`<div class="bn">A newer cloud copy exists. <button onclick="useCloud()">Load cloud copy</button><button onclick="pend=null;sync();render()">Keep this device</button></div>`:'')+remind()+V[v]()}
load();addEventListener('hashchange',render);render();cloud();pwa();
